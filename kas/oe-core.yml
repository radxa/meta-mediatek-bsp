header:
  version: 11
  includes:
  - kas/include/deps.yml
  - kas/include/base.yml

repos:
  core:
    url: https://git.openembedded.org/openembedded-core
    path: layers/oe-core
    refspec: scarthgap
    layers:
      meta:
  bitbake:
    url: https://git.openembedded.org/bitbake
    path: layers/bitbake
    refspec: '2.0'
    layers:
      conf: disabled

distro: nodistro

local_conf_header:
  # Well, it is easier not to have this for the ci part
  tclibcappend: |
    TCLIBCAPPEND = ""
