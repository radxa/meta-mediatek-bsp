CONFIG_REALTEK_PHY=y
CONFIG_DRM_ITE_IT66121=m
CONFIG_DRM_PANEL_STARTEK_KD070FHFID015=y
CONFIG_TOUCHSCREEN_GOODIX=m
CONFIG_SPI_SPIDEV=m

CONFIG_DRM_MEDIATEK_HDMI=m
CONFIG_PHY_MTK_MIPI_DSI=y
CONFIG_PHY_MTK_HDMI=m

# LVDS support
CONFIG_MTK_LVDS_SUPPORT=y
CONFIG_PHY_MTK_LVDS=y
CONFIG_DRM_PANEL_AUO_G156XTN010_LVDS=y

# The kernel does not boot if FRAMBUFFER_CONSOLE is set and the HDMI module
# is loaded too early (see AIOT-
# CONFIG_FRAMEBUFFER_CONSOLE is not set

# OTG
CONFIG_USB_CONN_GPIO=y
CONFIG_USB_MTU3_DUAL_ROLE=y
CONFIG_USB_XHCI_MTK=y

# Audio
CONFIG_SND_SOC_MT8365_EVK=y

# Camera
CONFIG_MEDIA_SUPPORT=y
CONFIG_V4L_PLATFORM_DRIVERS=y
CONFIG_MTK_CAMSV30=y
# CONFIG_MEDIA_SUBDRV_AUTOSELECT is not set
CONFIG_VIDEO_AP1302=m
CONFIG_VIDEO_AR0430=m
