require include/mt8391.inc
require include/mt7921.inc
require include/mt7925.inc

# Kernel
KERNEL_DEVICETREE = "mediatek/mt8391-genio-720-evk.dtb"

# U-Boot
UBOOT_MACHINE = "genio_720_evk_defconfig"

# libdram
LIBDRAM_BOARD_NAME = "genio-720-evk"

# OP-TEE
OPTEE_DRAM_SIZE = "0x200000000"

# LK
LK_BOARD_NAME = "${LIBDRAM_BOARD_NAME}"

MACHINE_FEATURES:append = " alsa bluetooth pci usbgadget usbhost wifi tsn uc-fde"

MACHINEOVERRIDES =. "mt8391-evk:genio-720-evk:"

# onsemi-firmware
ONSEMI_BOARD_NAME = "MediaTek_Genio"
MACHINE_EXTRA_RRECOMMENDS:append = " \
"
