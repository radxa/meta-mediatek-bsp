require include/mt8195.inc
require include/mt7921.inc
require include/mt7925.inc

# Kernel
KERNEL_DEVICETREE = "mediatek/mt8395-genio-1200-evk.dtb"

# U-Boot
UBOOT_MACHINE = "genio_1200_evk_defconfig"

# libdram
LIBDRAM_BOARD_NAME = "genio-1200-evk"

# OP-TEE
OPTEE_DRAM_SIZE = "0x200000000"

# LK
LK_BOARD_NAME = "mt8395-demo"

MACHINE_FEATURES:append = " alsa bluetooth pci usbgadget usbhost wifi tsn uc-fde"

MACHINEOVERRIDES =. "mt8395-evk:genio-1200-evk:"

# onsemi-firmware
ONSEMI_BOARD_NAME = "MediaTek_Genio"
MACHINE_EXTRA_RRECOMMENDS:append = " \
        onsemi-firmware-ap1302-ar0430 \
        onsemi-firmware-ap1302-ar0830 \
"

# Drivers for external I2C device
MACHINE_EXTRA_RRECOMMENDS:append = " \
        ite-it6510-driver \
        lontium-lt6911-driver \
"
