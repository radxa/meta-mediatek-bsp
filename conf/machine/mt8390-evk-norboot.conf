require include/mt8188.inc
require include/mt7921.inc
require include/ubifs-macronix-mx25u25635F.inc

# Kernel
KERNEL_DEVICETREE = "mediatek/mt8390-genio-700-evk.dtb"

#U-Boot
UBOOT_MACHINE = "genio_700_evk_qspi_defconfig"

#FIXME libdram for nor support
LIBDRAM_BOARD_NAME = "genio-700-evk"

# OP-TEE
OPTEE_DRAM_SIZE = "0x200000000"

#LK
LK_PROJECT = "mt8390-evk-norboot"
LK_BOARD_NAME = "${LIBDRAM_BOARD_NAME}"

# Trusted Firmware-A
TFA_NOR_FIP_ADDR = "0x400000"
TFA_NOR_FIP_LENGTH = "0x400000"
TFA_NOR_DRAMK_ADDR = "0x1400000"
TFA_NOR_MISC_ADDR = "0x1480000"

OVERRIDES .= ":nor-boot"

MACHINE_FEATURES:append = " nor-boot"
MACHINE_FEATURES:append = " alsa bluetooth pci usbgadget usbhost wifi tsn uc-fde"

MACHINEOVERRIDES =. "mt8188-evk:mt8390-evk:genio-700-evk:mt8390-evk-norboot:genio-700-evk-norboot:"

# onsemi-firmware
ONSEMI_BOARD_NAME = "MediaTek_Genio"
MACHINE_EXTRA_RRECOMMENDS:append = " \
        onsemi-firmware-ap1302-ar0430 \
        onsemi-firmware-ap1302-ar0830 \
"
