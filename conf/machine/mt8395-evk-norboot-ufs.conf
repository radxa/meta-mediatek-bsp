require include/mt8195.inc
require include/mt7921.inc
require include/ubifs-macronix-mx25u25635F.inc

# Kernel
KERNEL_DEVICETREE = "mediatek/mt8395-genio-1200-evk-ufs.dtb"

#FIXME U-Boot for nor support
UBOOT_MACHINE = "genio_1200_evk_ufs_qspi_defconfig"

#FIXME libdram for nor support
LIBDRAM_BOARD_NAME = "genio-1200-evk-ufs"

# OP-TEE
OPTEE_DRAM_SIZE = "0x200000000"

# LK
LK_PROJECT = "mt8395-evk-norboot-ufs"
LK_BOARD_NAME = "${LK_PROJECT}"

# UFS storage
WIC_SECTOR_SIZE = "4096"
WIC_BLOCK_SIZE = "4096"

OVERRIDES .= ":nor-boot"

MACHINE_FEATURES:append = " nor-boot ufs-system"
MACHINE_FEATURES:append = " alsa bluetooth pci usbgadget usbhost wifi tsn uc-fde"

MACHINEOVERRIDES =. "mt8395-evk:genio-1200-evk:mt8395-evk-norboot-ufs:genio-1200-evk-norboot-ufs:"
